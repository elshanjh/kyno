name: After Hours poster
on:
  push:
    paths: [".github/workflows/ah.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, io
          from PIL import Image
          UA={"User-Agent":"KYNO newsletter (info@kyno.az)"}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read()
          def q(**kw):
              kw["format"]="json"; return json.loads(get("https://en.wikipedia.org/w/api.php?"+urllib.parse.urlencode(kw)))
          p=list(q(action="query",titles="After Hours (film)",prop="pageprops|langlinks",lllang="az",redirects=1)["query"]["pages"].values())[0]
          img=p["pageprops"]["page_image"]
          url=list(q(action="query",titles="File:"+img,prop="imageinfo",iiprop="url")["query"]["pages"].values())[0]["imageinfo"][0]["url"]
          im=Image.open(io.BytesIO(get(url))).convert("RGB"); w,h=im.size
          im.resize((400,round(h*400/w)),Image.LANCZOS).save("assets/img/news/posters/after-hours.jpg",quality=85,optimize=True,progressive=True)
          s=list(q(action="query",titles="Martin Scorsese",prop="langlinks",lllang="az",redirects=1)["query"]["pages"].values())[0]
          open("ah-report.txt","w").write("%s %dx%d\nscorsese az: %s\n"%(img,w,h,s.get("langlinks")))
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/ah.yml
          git add assets/img/news/posters ah-report.txt
          git commit -m "Add After Hours poster"
          git push
