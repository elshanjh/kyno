name: Fetch Honey Boy poster
on:
  push:
    paths: [".github/workflows/hb.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, io
          from PIL import Image
          UA={"User-Agent":"KYNO newsletter (info@kyno.az)"}
          def q(**kw):
              kw["format"]="json"
              return json.loads(urllib.request.urlopen(urllib.request.Request("https://en.wikipedia.org/w/api.php?"+urllib.parse.urlencode(kw),headers=UA)).read())
          pp=list(q(action="query",titles="Honey Boy (film)",prop="pageprops",redirects=1)["query"]["pages"].values())[0]["pageprops"]
          img=pp["page_image"]; print(img)
          url=list(q(action="query",titles="File:"+img,prop="imageinfo",iiprop="url")["query"]["pages"].values())[0]["imageinfo"][0]["url"]
          im=Image.open(io.BytesIO(urllib.request.urlopen(urllib.request.Request(url,headers=UA)).read())).convert("RGB")
          w,h=im.size; im.resize((400,round(h*400/w)),Image.LANCZOS).save("assets/img/news/posters/honey-boy.jpg",quality=85,optimize=True,progressive=True)
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/hb.yml
          git add assets/img/news/posters/honey-boy.jpg
          git commit -m "Add Honey Boy poster for newsletter #1"
          git push
