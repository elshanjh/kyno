name: Holdovers poster
on:
  push:
    paths: [".github/workflows/ho.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, io, re
          from PIL import Image
          UA={"User-Agent":"KYNO newsletter (info@kyno.az)"}
          def get(u,ua=UA): return urllib.request.urlopen(urllib.request.Request(u,headers=ua),timeout=40).read()
          def q(**kw):
              kw["format"]="json"; return json.loads(get("https://en.wikipedia.org/w/api.php?"+urllib.parse.urlencode(kw)))
          out=[]
          pp=list(q(action="query",titles="The Holdovers",prop="pageprops",redirects=1)["query"]["pages"].values())[0]["pageprops"]
          img=pp["page_image"]
          url=list(q(action="query",titles="File:"+img,prop="imageinfo",iiprop="url")["query"]["pages"].values())[0]["imageinfo"][0]["url"]
          x=Image.open(io.BytesIO(get(url))).convert("RGB"); w,h=x.size
          x.resize((400,round(h*400/w)),Image.LANCZOS).save("assets/img/news/posters/the-holdovers.jpg",quality=85,optimize=True,progressive=True)
          out.append("%s %dx%d"%(img,w,h))
          for t in ["Alexander Payne","Paul Giamatti","Da'Vine Joy Randolph"]:
              p=list(q(action="query",titles=t,prop="langlinks",lllimit=500,redirects=1)["query"]["pages"].values())[0]
              ll={l["lang"]:l["*"] for l in p.get("langlinks",[])}
              out.append("%s az=%s ru=%s"%(t,ll.get("az"),ll.get("ru")))
          h=get("https://letterboxd.com/film/the-holdovers/",{"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"}).decode("utf8","ignore")
          m=re.search(r'<meta property="og:title" content="([^"]+)"',h); out.append("LB "+(m.group(1) if m else "?"))
          open("ho-report.txt","w").write("\n".join(out)+"\n")
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/ho.yml
          git add -A assets/img/news ho-report.txt
          git commit -m "Holdovers poster"
          git push
