name: Check links
on:
  push:
    paths: [".github/workflows/lb.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import urllib.request, re
          BUA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"}
          out=[]
          for s in ["the-fly-1986","over-the-garden-wall-2014","over-the-garden-wall-2014-1"]:
              try:
                  h=urllib.request.urlopen(urllib.request.Request("https://letterboxd.com/film/%s/"%s,headers=BUA),timeout=30).read().decode("utf8","ignore")
                  m=re.search(r'<meta property="og:title" content="([^"]+)"',h); out.append("%s -> %s"%(s,m.group(1) if m else "?"))
              except Exception as e: out.append("%s error %s"%(s,e))
          open("lb-report.txt","w").write("\n".join(out)+"\n")
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/lb.yml
          git add lb-report.txt
          git commit -m "Link check"
          git push
