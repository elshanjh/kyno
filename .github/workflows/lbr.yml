name: Fetch reviews
on:
  push:
    paths: [".github/workflows/lbr.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          python3 - <<'PY'
          import urllib.request, re, html, json, io
          from PIL import Image
          BUA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36","Accept-Language":"en"}
          def get(u,h=BUA): return urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=40).read().decode("utf8","ignore")
          out={}
          for k,u in [("masud","https://letterboxd.com/anjollras/film/by-the-bluest-of-seas/"),("eldar","https://letterboxd.com/eldarhasanly/film/dumka/")]:
              try:
                  h=get(u)
                  body=re.search(r'<div class="review body-text[^"]*"[^>]*>(.*?)</div>\s*</div>',h,re.S) or re.search(r'class="js-review-body[^"]*">(.*?)</div>',h,re.S)
                  paras=re.findall(r"<p>(.*?)</p>",body.group(1),re.S) if body else []
                  paras=[html.unescape(re.sub(r"<br\s*/?>","\n",re.sub(r"<(?!br)[^>]+>","",p))).strip() for p in paras]
                  title=re.search(r'<meta property="og:title" content="([^"]+)"',h)
                  rating=re.search(r'class="rating[^"]*rated-(\d+)"',h)
                  date=re.search(r'datetime="([^"]+)"',h) or re.search(r'Watched\s+([^<]+)<',h)
                  film=re.search(r'href="(/film/[^/]+/)"',h)
                  out[k]={"title":title.group(1) if title else None,"rating":rating.group(1) if rating else None,"date":date.group(1) if date else None,"film":film.group(1) if film else None,"paras":paras}
                  if film:
                      fh=get("https://letterboxd.com"+film.group(1))
                      ld=re.search(r'<script type="application/ld\+json">\s*(?:/\*.*?\*/)?\s*(\{.*?\})\s*(?:/\*.*?\*/)?\s*</script>',fh,re.S)
                      if ld:
                          j=json.loads(ld.group(1)); out[k]["ld"]={"name":j.get("name"),"img":j.get("image"),"dir":[d.get("name") for d in j.get("director",[])],"year":(j.get("releasedEvent") or [{}])[0].get("startDate")}
                          if j.get("image"):
                              im=Image.open(io.BytesIO(urllib.request.urlopen(urllib.request.Request(j["image"],headers=BUA),timeout=40).read())).convert("RGB"); w,hh=im.size
                              im.resize((400,round(hh*400/w)),Image.LANCZOS).save("assets/img/news/posters/%s.jpg"%("by-the-bluest-of-seas" if k=="masud" else "dumka"),quality=85,optimize=True,progressive=True)
                              out[k]["poster"]="%dx%d"%(w,hh)
              except Exception as e: out[k]={"error":str(e)}
          open("lbr-report.json","w").write(json.dumps(out,ensure_ascii=False,indent=1))
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/lbr.yml
          git add -A assets/img/news lbr-report.json
          git commit -m "Fetched reviews"
          git push
