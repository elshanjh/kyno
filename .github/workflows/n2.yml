name: Names and posters 2
on:
  push:
    paths: [".github/workflows/n2.yml"]
permissions:
  contents: write
jobs:
  n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, io
          from PIL import Image
          UA={"User-Agent":"KYNO newsletter (info@kyno.az)"}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read()
          def q(lang,**kw):
              kw["format"]="json"; return json.loads(get("https://%s.wikipedia.org/w/api.php?"%lang+urllib.parse.urlencode(kw)))
          out=[]
          for t in ["Bryan Cranston","Aaron Paul","Sergei Parajanov","Shadows of Forgotten Ancestors (film)"]:
              p=list(q("en",action="query",titles=t,prop="langlinks",lllimit=500,redirects=1)["query"]["pages"].values())[0]
              ll={l["lang"]:l["*"] for l in p.get("langlinks",[])}
              out.append("%s\taz=%s\tru=%s"%(t,ll.get("az"),ll.get("ru")))
          def poster(slug,search):
              res=[r["title"] for r in q("en",action="query",list="search",srsearch=search,srlimit=5)["query"]["search"]]
              out.append("%s search=%s"%(slug,res))
              for t in res[:2]:
                  p=list(q("en",action="query",titles=t,prop="langlinks",lllimit=500,redirects=1)["query"]["pages"].values())[0]
                  for lang,tt in [("en",p["title"])]+[(l["lang"],l["*"]) for l in p.get("langlinks",[])]:
                      try:
                          pp=list(q(lang,action="query",titles=tt,prop="pageprops",redirects=1)["query"]["pages"].values())[0].get("pageprops",{})
                          img=pp.get("page_image") or pp.get("page_image_free")
                          if not img: continue
                          url=list(q(lang,action="query",titles="File:"+img,prop="imageinfo",iiprop="url")["query"]["pages"].values())[0]["imageinfo"][0]["url"]
                          im=Image.open(io.BytesIO(get(url))).convert("RGB"); w,h=im.size
                          if h<w*1.2: continue
                          im.resize((400,round(h*400/w)),Image.LANCZOS).save("assets/img/news/posters/%s.jpg"%slug,quality=85,optimize=True,progressive=True)
                          out.append("USED %s %s:%s %s %dx%d"%(slug,lang,tt,img,w,h)); return
                      except Exception as e: pass
              out.append("NONE %s"%slug)
          poster("maborosi","Maborosi 1995 Kore-eda film")
          poster("shadows-of-forgotten-ancestors","Shadows of Forgotten Ancestors 1965 Parajanov film")
          open("n2-report.txt","w").write("\n".join(out)+"\n")
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/n2.yml
          git add assets/img/news/posters n2-report.txt
          git commit -m "Names and posters for newsletter #1"
          git push
