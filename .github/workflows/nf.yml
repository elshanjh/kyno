name: Nosferatu stills
on:
  push:
    paths: [".github/workflows/nf.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          mkdir -p /tmp/nf
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, io
          from PIL import Image
          UA={"User-Agent":"KYNO newsletter (info@kyno.az)"}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=40).read()
          def q(**kw):
              kw["format"]="json"; return json.loads(get("https://commons.wikimedia.org/w/api.php?"+urllib.parse.urlencode(kw)))
          out=[]; n=0
          for term in ["Nosferatu shadow stairs","Nosferatu 1922 Max Schreck","Nosferatu Orlok shadow"]:
              r=q(action="query",list="search",srsearch=term,srnamespace=6,srlimit=8)["query"]["search"]
              for x in r:
                  t=x["title"]
                  if not t.lower().endswith((".jpg",".jpeg",".png")): continue
                  if any(t==o.split("\t")[1] for o in out): continue
                  info=list(q(action="query",titles=t,prop="imageinfo",iiprop="url|size|extmetadata",iiurlwidth=1400)["query"]["pages"].values())[0]["imageinfo"][0]
                  lic=info.get("extmetadata",{}).get("LicenseShortName",{}).get("value","?")
                  try:
                      im=Image.open(io.BytesIO(get(info.get("thumburl") or info["url"]))).convert("RGB")
                      im.thumbnail((700,700)); im.save("/tmp/nf/%02d.jpg"%n,quality=80)
                      out.append("%02d\t%s\t%s\t%dx%d\t%s"%(n,t,lic,info["width"],info["height"],info.get("thumburl") or info["url"])); n+=1
                  except Exception as e: out.append("err %s %s"%(t,e))
                  if n>=12: break
              if n>=12: break
          # contact sheet
          ims=[Image.open("/tmp/nf/%02d.jpg"%i) for i in range(n)]
          W=4; cell=360
          sheet=Image.new("RGB",(W*cell,((n+W-1)//W)*cell),"white")
          from PIL import ImageDraw
          d=ImageDraw.Draw(sheet)
          for i,im in enumerate(ims):
              im.thumbnail((cell-10,cell-30)); sheet.paste(im,((i%W)*cell+5,(i//W)*cell+25)); d.text(((i%W)*cell+5,(i//W)*cell+5),"%02d"%i,fill="red")
          sheet.save("nf-sheet.jpg",quality=80)
          open("nf-report.txt","w").write("\n".join(out)+"\n")
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/nf.yml
          git add nf-report.txt nf-sheet.jpg
          git commit -m "Nosferatu candidates"
          git push
