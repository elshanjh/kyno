name: Nosferatu full
on:
  push:
    paths: [".github/workflows/nf2.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          curl -fsSL -A "KYNO newsletter (info@kyno.az)" -o /tmp/n.png "https://upload.wikimedia.org/wikipedia/commons/f/f2/Nosferatu_%281922%29_-_Count_Orlok_Standing_In_A_Wooden_Doorway_%28Greyscale%29.png"
          python3 -c "
          from PIL import Image
          Image.open('/tmp/n.png').convert('L').save('assets/img/news/nosferatu-src.jpg',quality=92)
          "
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/nf2.yml
          git add assets/img/news/nosferatu-src.jpg
          git commit -m "Add public-domain Nosferatu still"
          git push
