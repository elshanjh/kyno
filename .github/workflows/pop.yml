name: Popular posters
on:
  push:
    paths: [".github/workflows/pop.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, io
          from PIL import Image
          UA={"User-Agent":"KYNO newsletter (info@kyno.az)"}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=40).read()
          def q(**kw):
              kw["format"]="json"; return json.loads(get("https://en.wikipedia.org/w/api.php?"+urllib.parse.urlencode(kw)))
          out=[]
          for slug,t in [("pulp-fiction","Pulp Fiction"),("interstellar","Interstellar (film)"),("parasite","Parasite (2019 film)"),("the-godfather","The Godfather")]:
              try:
                  pp=list(q(action="query",titles=t,prop="pageprops",redirects=1)["query"]["pages"].values())[0]["pageprops"]
                  img=pp["page_image"]
                  url=list(q(action="query",titles="File:"+img,prop="imageinfo",iiprop="url")["query"]["pages"].values())[0]["imageinfo"][0]["url"]
                  x=Image.open(io.BytesIO(get(url))).convert("RGB"); w,h=x.size
                  x.resize((400,round(h*400/w)),Image.LANCZOS).save("assets/img/news/posters/%s.jpg"%slug,quality=85,optimize=True,progressive=True)
                  out.append("%s %s %dx%d"%(slug,img,w,h))
              except Exception as e: out.append("%s err %s"%(slug,e))
          open("pop-report.txt","w").write("\n".join(out)+"\n")
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/pop.yml
          git add -A assets/img/news pop-report.txt
          git commit -m "Popular posters for promo"
          git push
