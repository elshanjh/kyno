name: Fetch newsletter posters
on:
  push:
    paths: [".github/workflows/posters.yml"]
permissions:
  contents: write
jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Fetch posters
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, io
          from PIL import Image, ImageOps
          UA = {"User-Agent": "KYNO newsletter (info@kyno.az)"}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30).read()
          def q(lang, **kw):
              kw["format"] = "json"
              return json.loads(get("https://%s.wikipedia.org/w/api.php?" % lang + urllib.parse.urlencode(kw)))
          def page_image(lang, title):
              pages = q(lang, action="query", titles=title, prop="pageprops", redirects=1)["query"]["pages"]
              pp = list(pages.values())[0].get("pageprops", {})
              img = pp.get("page_image") or pp.get("page_image_free")
              if not img: return None, None
              info = q(lang, action="query", titles="File:" + img, prop="imageinfo", iiprop="url")["query"]["pages"]
              return img, list(info.values())[0]["imageinfo"][0]["url"]
          def save(slug, url):
              im = ImageOps.exif_transpose(Image.open(io.BytesIO(get(url)))).convert("RGB")
              w, h = im.size
              im = im.resize((400, round(h * 400 / w)), Image.LANCZOS)
              im.save("assets/img/news/posters/%s.jpg" % slug, quality=85, optimize=True, progressive=True)
              return w, h
          films = {
            "woman-unknown": "Woman Unknown (film)",
            "the-social-reckoning": "The Social Reckoning",
            "other-mommy": "Other Mommy",
            "cliff-booth": "The Further Mis-Adventures of Cliff Booth",
            "verity": "Verity (film)",
          }
          report = []
          for slug, title in films.items():
              line = slug
              tries = [("en", title)]
              try:
                  ll = q("en", action="query", titles=title, prop="langlinks", lllimit=500, redirects=1)["query"]["pages"]
                  for l in list(ll.values())[0].get("langlinks", []):
                      tries.append((l["lang"], l["*"]))
              except Exception as e:
                  line += "\tlanglinks error %s" % e
              done = False
              for lang, t in tries:
                  try:
                      img, url = page_image(lang, t)
                  except Exception as e:
                      continue
                  if not url: continue
                  try:
                      im = Image.open(io.BytesIO(get(url)))
                  except Exception:
                      continue
                  w, h = im.size
                  if h < w * 1.2:
                      line += "\tskip %s:%s %s (%dx%d)" % (lang, t, img, w, h); continue
                  save(slug, url)
                  line += "\tUSED %s:%s %s (%dx%d)" % (lang, t, img, w, h)
                  done = True; break
              if not done: line += "\tNONE (tried %d)" % len(tries)
              report.append(line)
          open("assets/img/news/posters/report.txt", "w").write("\n".join(report) + "\n")
          print("\n".join(report))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/posters.yml
          git add assets/img/news/posters
          git commit -m "Add more film posters for newsletter #1"
          git push
