name: Stewart photos
on:
  push:
    paths: [".github/workflows/ps.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, io
          from PIL import Image, ImageDraw
          UA={"User-Agent":"KYNO newsletter (info@kyno.az)"}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=40).read()
          def q(**kw):
              kw["format"]="json"; return json.loads(get("https://commons.wikimedia.org/w/api.php?"+urllib.parse.urlencode(kw)))
          files=[]
          cm=q(action="query",list="categorymembers",cmtitle="Category:Patrick Stewart",cmtype="file",cmlimit=60)["query"]["categorymembers"]
          files=[c["title"] for c in cm if c["title"].lower().endswith((".jpg",".jpeg",".png"))]
          out=[]; ims=[]
          for t in files[:40]:
              try:
                  ii=list(q(action="query",titles=t,prop="imageinfo",iiprop="url|size|extmetadata",iiurlwidth=500)["query"]["pages"].values())[0]["imageinfo"][0]
                  lic=ii.get("extmetadata",{}).get("LicenseShortName",{}).get("value","?")
                  art=ii.get("extmetadata",{}).get("Artist",{}).get("value","?")
                  im=Image.open(io.BytesIO(get(ii["thumburl"]))).convert("RGB")
                  ims.append(im); out.append("%02d\t%s\t%s\t%dx%d\t%s\t%s"%(len(ims)-1,t,lic,ii["width"],ii["height"],ii["url"],art[:120].replace("\n"," ")))
              except Exception as e: out.append("err %s %s"%(t,e))
          cell=300; W=6
          sheet=Image.new("RGB",(W*cell,((len(ims)+W-1)//W)*cell),"white"); d=ImageDraw.Draw(sheet)
          for i,im in enumerate(ims):
              im.thumbnail((cell-10,cell-30)); sheet.paste(im,((i%W)*cell+5,(i//W)*cell+25)); d.text(((i%W)*cell+5,(i//W)*cell+5),"%02d"%i,fill="red")
          sheet.save("ps-sheet.jpg",quality=80)
          open("ps-report.txt","w").write("\n".join(out)+"\n")
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/ps.yml
          git add ps-sheet.jpg ps-report.txt
          git commit -m "Stewart photo candidates"
          git push
