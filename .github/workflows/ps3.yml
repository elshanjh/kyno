name: Stewart photo
on:
  push:
    paths: [".github/workflows/ps3.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          curl -fsSL -A "KYNO newsletter (info@kyno.az)" -o /tmp/ps.jpg "https://upload.wikimedia.org/wikipedia/commons/b/bb/Patrick_Stewart_%2848445287607%29.jpg"
          python3 - <<'PY'
          from PIL import Image, ImageOps
          im=ImageOps.exif_transpose(Image.open("/tmp/ps.jpg")).convert("L")
          w,h=im.size
          th=int(w*3/4); top=int(h*0.02)
          im=im.crop((0,top,w,top+th)).resize((1040,780),Image.LANCZOS)
          ImageOps.autocontrast(im,cutoff=1).save("assets/img/news/patrick-stewart.jpg",quality=84,optimize=True,progressive=True)
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/ps3.yml
          git add assets/img/news/patrick-stewart.jpg
          git commit -m "New Patrick Stewart photo for newsletter #2"
          git push
