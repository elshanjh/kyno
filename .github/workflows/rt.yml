name: Letterboxd ratings
on:
  push:
    paths: [".github/workflows/rt.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import urllib.request, re
          BUA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"}
          out=[]
          for s in ["over-the-garden-wall-2014","suspiria","the-crow","eraserhead","the-fly-1986"]:
              try:
                  h=urllib.request.urlopen(urllib.request.Request("https://letterboxd.com/film/%s/"%s,headers=BUA),timeout=30).read().decode("utf8","ignore")
                  m=re.search(r'name="twitter:data2" content="([^"]+)"',h)
                  j=re.search(r'"ratingValue":\s*([0-9.]+)',h)
                  out.append("%s\t%s\t%s"%(s,m.group(1) if m else "?", j.group(1) if j else "?"))
              except Exception as e: out.append("%s error %s"%(s,e))
          open("rt-report.txt","w").write("\n".join(out)+"\n")
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/rt.yml
          git add rt-report.txt
          git commit -m "Ratings check"
          git push
