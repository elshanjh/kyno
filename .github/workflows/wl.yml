name: We Live in Time poster
on:
  push:
    paths: [".github/workflows/wl.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, io
          from PIL import Image
          UA={"User-Agent":"KYNO newsletter (info@kyno.az)"}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read()
          def q(**kw):
              kw["format"]="json"; return json.loads(get("https://en.wikipedia.org/w/api.php?"+urllib.parse.urlencode(kw)))
          out=[]
          p=list(q(action="query",titles="We Live in Time",prop="pageprops",redirects=1)["query"]["pages"].values())[0]
          img=p["pageprops"]["page_image"]
          url=list(q(action="query",titles="File:"+img,prop="imageinfo",iiprop="url")["query"]["pages"].values())[0]["imageinfo"][0]["url"]
          im=Image.open(io.BytesIO(get(url))).convert("RGB"); w,h=im.size
          im.resize((400,round(h*400/w)),Image.LANCZOS).save("assets/img/news/posters/we-live-in-time.jpg",quality=85,optimize=True,progressive=True)
          out.append("%s %dx%d"%(img,w,h))
          for t in ["John Crowley (director)","Florence Pugh","Andrew Garfield"]:
              pp=list(q(action="query",titles=t,prop="langlinks",lllimit=500,redirects=1)["query"]["pages"].values())[0]
              ll={l["lang"]:l["*"] for l in pp.get("langlinks",[])}
              out.append("%s az=%s ru=%s"%(t,ll.get("az"),ll.get("ru")))
          open("wl-report.txt","w").write("\n".join(out)+"\n")
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/wl.yml
          git add assets/img/news/posters wl-report.txt
          git commit -m "Add We Live in Time poster"
          git push
